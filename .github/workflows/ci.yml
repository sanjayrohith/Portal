# CI — lint, unit tests, race detector, and containerized end-to-end suites.
#
# Jobs:
#   lint   gofmt gate + go vet ./...
#   test   build + unit tests on a multi-OS matrix (linux/macos/windows)
#   race   full suite under the race detector (linux)
#   e2e    containerized run: compose build, then the orchestration harness
#          (scripts/e2e.sh boots a live daemon and runs TestEndToEnd*)
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  CGO_ENABLED: "1"

jobs:
  lint:
    name: lint (gofmt + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt gate
        run: |
          unformatted=$(gofmt -l cmd/ internal/ pkg/)
          if [[ -n "$unformatted" ]]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build
        run: go build ./...
      - name: unit tests
        run: go test -count=1 ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: full suite with -race
        run: go test -race -count=1 ./...

  e2e:
    name: containerized e2e
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: validate compose environment
        run: docker compose config
      - name: build service images
        run: docker compose build portald
      - name: orchestration harness (live daemon + TestEndToEnd*)
        run: ./scripts/e2e.sh -- -count=1
