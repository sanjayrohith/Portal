# dnsmasq.conf — mock DNS resolver for local end-to-end testing.
#
# Resolves *.portal.test to the portald container's static IP
# (172.28.0.10, see docker-compose.yml) so e2e suites can address stable
# subdomains like `webhook.portal.test` without touching host DNS.
port=53
no-resolv
no-hosts
log-queries
address=/portal.test/172.28.0.10
